name: diag gate failures

# 一次性诊断：把门禁失败用例的断言原文写成 diag-report.txt 并推回本分支。
# 走 git 而不是 REST API —— 匿名 API 有 60 次/小时的限流，git 没有。
# 用完即删，不进 main。

on:
  push:
    branches:
      - 'diag/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 与 nuget-publish.yml 完全一致：Release + 强制 Version，复现门禁的真实条件。
      - name: Build (same flags as publish)
        run: >
          dotnet build Pi.slnx -c Release
          -p:ContinuousIntegrationBuild=true
          -p:Version=1.5.0

      # GitHub 的 bash shell 带 -e：dotnet test 返回非零会直接掐掉脚本，
      # 所以每处可能失败的地方都用 if 形式兜住。
      - name: Run failing projects and collect
        run: |
          set -uo pipefail
          report="diag-report.txt"
          : > "${report}"
          {
            echo "# diag report"
            echo "commit: ${GITHUB_SHA}"
            echo "runner: ${RUNNER_OS} $(uname -r 2>/dev/null || true)"
            echo
          } >> "${report}"

          projects=(
            tests/Pi.Ai.Tests/Pi.Ai.Tests.csproj
            tests/Pi.CodingAgent.Tests/Pi.CodingAgent.Tests.csproj
            tests/Pi.Durable.Tests/Pi.Durable.Tests.csproj
          )
          for p in "${projects[@]}"; do
            name="$(basename "${p}" .csproj)"
            if dotnet test "${p}" -c Release -f net10.0 --no-build \
                 -- --report-xunit-trx --report-xunit-trx-filename "${name}.trx" \
                 > "test-${name}.log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            {
              echo "=============================================================="
              echo "## ${name}  exit=${rc}"
              echo "=============================================================="
            } >> "${report}"

            trx="$(find tests -name "${name}.trx" -print -quit 2>/dev/null || true)"
            if [ -n "${trx}" ] && [ -f "${trx}" ]; then
              echo "--- 失败用例 ---" >> "${report}"
              grep -ao 'testName="[^"]*"[^>]*outcome="Failed"' "${trx}" \
                | sed -E 's/testName="([^"]*)".*/\1/' | sort -u >> "${report}" || true
              # 断言正文只在 TRX 的 ErrorInfo/Message 里；MTP 的 .log 只有汇总。
              echo "--- TRX 失败段 ---" >> "${report}"
              grep -a -A 25 'outcome="Failed"' "${trx}" | head -400 >> "${report}" || true
            fi

            # 断言正文在 MTP 的内层日志里；stdout 只有一行汇总。
            mtplog=$(ls tests/*/bin/Release/net10.0/TestResults/${name}_net10.0_x64.log 2>/dev/null | head -1 || true)
            if [ -n "${mtplog}" ] && [ -f "${mtplog}" ]; then
              echo "--- 内层日志：${mtplog} ---" >> "${report}"
              tail -400 "${mtplog}" >> "${report}" || true
            else
              echo "--- 内层日志缺失，贴 stdout 尾部 ---" >> "${report}"
              tail -120 "test-${name}.log" >> "${report}" || true
            fi
            echo >> "${report}"
          done
          ls -l "${report}"

      - name: Push report back to this branch
        run: |
          set -uo pipefail
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add -f diag-report.txt
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
            exit 0
          fi
          git commit -m "diag report [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
