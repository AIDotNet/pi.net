name: diag gate failures

# 一次性诊断：把门禁失败用例的**断言原文**以 annotation 形式发出来。
# annotations 公开可读（GET /repos/{o}/{r}/check-runs/{id}/annotations），
# 因此不需要 token 就能拿到 runner 上的失败原因。
# 刻意只用 bash / sed / awk：不依赖 python 等 runner 上不确定存在的解释器。
# 用完即删，不进 main。

on:
  push:
    branches:
      - 'diag/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 与 nuget-publish.yml 完全一致：Release + 强制 Version，复现门禁的真实条件。
      - name: Build (same flags as publish)
        run: >
          dotnet build Pi.slnx -c Release
          -p:ContinuousIntegrationBuild=true
          -p:Version=1.5.0

      - name: Run failing projects and annotate
        run: |
          set -uo pipefail

          # 把一段文本压成单行 annotation：先转义 %，换行转 %0A，最多 60 行。
          annotate() {
            local title="$1" body="$2"
            local escaped
            escaped=$(printf '%s\n' "${body}" \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | awk 'NR > 60 { exit } NR > 1 { printf "%%0A" } { printf "%s", $0 }')
            [ -z "${escaped}" ] && escaped="(无输出)"
            echo "::error title=${title}::${escaped}"
          }

          projects=(
            tests/Pi.Ai.Tests/Pi.Ai.Tests.csproj
            tests/Pi.CodingAgent.Tests/Pi.CodingAgent.Tests.csproj
            tests/Pi.Durable.Tests/Pi.Durable.Tests.csproj
          )
          for p in "${projects[@]}"; do
            name="$(basename "${p}" .csproj)"
            echo "== ${name}"
            dotnet test "${p}" -c Release -f net10.0 --no-build \
              -- --report-xunit-trx --report-xunit-trx-filename "${name}.trx" \
              > "test-${name}.log" 2>&1
            rc=$?
            echo "   exit=${rc}"

            trx="$(find tests -name "${name}.trx" -print -quit 2>/dev/null || true)"
            if [ -n "${trx}" ] && [ -f "${trx}" ]; then
              # 逐条失败用例名（与 scripts/gate-tests.sh 同一套抽取方式）。
              names=$(grep -ao 'testName="[^"]*"[^>]*outcome="Failed"' "${trx}" \
                | sed -E 's/testName="([^"]*)".*/\1/' | sort -u | head -20 || true)
              if [ -n "${names}" ]; then
                while IFS= read -r t; do
                  [ -z "${t}" ] && continue
                  echo "::error title=${name}::${t}"
                done <<< "${names}"
              fi
            else
              echo "   （没找到 ${name}.trx）"
            fi

            # 失败详情：优先抓断言/异常行，抓不到就退回日志尾部。
            detail=$(grep -a -E "Assert|预期|实际|Expected|Actual|Error Message|Stack Trace|Exception|失败!|error run failed" \
              "test-${name}.log" | head -60 || true)
            if [ -z "${detail}" ]; then
              detail=$(tail -40 "test-${name}.log")
            fi
            annotate "${name} 详情" "${detail}"

            tail -3 "test-${name}.log" || true
          done

      - name: Upload logs and trx
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-trx
          path: |
            tests/**/*.trx
            test-*.log
          retention-days: 3
          if-no-files-found: ignore
