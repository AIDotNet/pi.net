name: CI

# 提交/PR 的常规校验：构建 + 打包冒烟。默认不跑测试，原因见下方 Test 步骤的说明。
# 发布本身由 nuget-publish.yml 负责，两者互不阻塞。
#
# 需要跑全量测试时：Actions -> CI -> Run workflow，勾选 run_tests。
#
# 纯文档提交不触发：仓库里 docs:/memory 类提交约占三成，跑一遍完整编译没有信息量。
# 注意 paths-ignore 只按「本次提交涉及的文件」判断——文档提交里一旦混进 .cs/.csproj，
# 整条流水线照常跑，所以不必担心改 README 时顺手改的代码漏检。

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.workbuddy/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.workbuddy/**'
  workflow_dispatch:
    inputs:
      run_tests:
        description: '同时跑全量测试（需要真实交互终端与 sshd，GitHub runner 不满足，会出现已知失败）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-pack:
    name: Build and pack
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Report SDK
        run: |
          echo "::notice title=SDK version::$(dotnet --version)"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: |
          set +e
          dotnet restore Pi.slnx 2>&1 | tee restore.log
          status="${PIPESTATUS[0]}"
          if [[ "${status}" -ne 0 ]]; then
            # 把报错行提升为 annotation，这样在 run 页面和 API 上都能直接看到原因。
            grep -E "error|NU[0-9]{4}|MSB[0-9]{4}" restore.log | head -8 | while IFS= read -r line; do
              echo "::error title=restore::${line}"
            done
            exit 1
          fi

      - name: Build
        run: dotnet build Pi.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      # 打包冒烟：不推送，只确认 13 个库仍能产出包（防止 Assets/Pack 元数据回归）。
      - name: Pack (smoke)
        run: dotnet pack Pi.slnx -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true

      - name: Verify 13 packages
        run: |
          set -euo pipefail
          count="$(find artifacts -name '*.nupkg' | wc -l)"
          if [[ "${count}" -ne 13 ]]; then
            echo "::error::期望 13 个 nupkg，实际 ${count} 个"
            ls -1 artifacts
            exit 1
          fi
          for pkg in Pi.Cli Pi.Vacation Pi.DurableHost Pi.Evals; do
            if compgen -G "artifacts/${pkg}.*.nupkg" > /dev/null; then
              echo "::error::可执行项目 ${pkg} 不应产出 NuGet 包"
              exit 1
            fi
          done
          echo "OK: 13 个库包，未包含可执行项目" >> "${GITHUB_STEP_SUMMARY}"

      # 测试默认不跑：这套用例依赖真实交互终端与本地 sshd，GitHub runner 是非交互会话、
      # 没有 ssh 服务，实测 ubuntu 失败 959 项、windows 失败 369 项（Pi.Tui / Pi.Env 为主）。
      # 本地用 `dotnet test Pi.slnx -c Release` 跑全量（约 3.5 分钟，仅已知负载敏感 flake）。
      # 这里保留手动入口，失败只告警不阻塞，方便在 runner 上观察环境相关差异。
      - name: Test (optional)
        if: inputs.run_tests == true
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          dotnet test Pi.slnx -c Release --no-build > test.log 2>&1
          status=$?
          set -e
          tail -40 test.log
          if [[ "${status}" -ne 0 ]]; then
            grep -E "Failed!|error run failed" test.log | head -10 | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::warning title=test::${line}"
            done
          fi

      - name: Upload test log
        if: always() && inputs.run_tests == true
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: test.log
          retention-days: 7
          if-no-files-found: ignore
