name: CI

# 提交/PR 的常规校验：构建 + 全量测试 + 打包冒烟检查。
# 发布本身由 nuget-publish.yml 负责，两者互不阻塞——测试挂了不会挡住已打 tag 的发布，
# 但会把 main 分支标红，提醒先修问题。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and test
    # 测试跑在 windows-latest：这批用例是在 Windows 上开发和验收的。
    # 同一份代码在 ubuntu-latest 上目前有 959 项失败（Pi.Tui 840 / Pi.CodingAgent 76 /
    # Pi.Env 38 / Pi.Ai 3 / Pi.Durable 2），属于尚未处理的跨平台差距，另立任务跟进；
    # CI 先守住主平台，避免长期红灯失去信号价值。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Report SDK
        run: |
          echo "::notice title=SDK version::$(dotnet --version)"
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: |
          set +e
          dotnet restore Pi.slnx 2>&1 | tee restore.log
          status="${PIPESTATUS[0]}"
          if [[ "${status}" -ne 0 ]]; then
            # 把报错行提升为 annotation，这样在 run 页面和 API 上都能直接看到原因，
            # 不必下载完整日志。
            grep -E "error|NU[0-9]{4}|MSB[0-9]{4}" restore.log | head -8 | while IFS= read -r line; do
              echo "::error title=restore::${line}"
            done
            exit 1
          fi

      - name: Build
        run: dotnet build Pi.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        # 不要加 -m:1：串行执行时测试项目之间会互相干扰（本地实测 Pi.Ai.Tests 出现并行时没有的
        # 2 个失败，Pi.CodingAgent.Tests 更是 18 分钟不结束）。并行跑 30103 项约 3.5 分钟。
        # 首轮失败会重跑一次，用来排除 ModelSelectorTests / ThemeRuntimeTests 这两个已知的
        # 负载敏感 flake（见 docs/coding-agent-porting-status.md 观测名单）。
        run: |
          set -uo pipefail
          set +e
          dotnet test Pi.slnx -c Release --no-build > test.log 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            tail -30 test.log
            exit 0
          fi
          echo "::warning::首轮测试失败，重跑一次以排除已知负载敏感 flake"
          set +e
          dotnet test Pi.slnx -c Release --no-build > test-retry.log 2>&1
          status=$?
          set -e
          tail -40 test-retry.log
          if [[ "${status}" -eq 0 ]]; then
            echo "::warning::重跑通过，首轮失败属负载敏感 flake"
            exit 0
          fi
          grep -E "Failed!|error run failed" test-retry.log | head -10 | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error title=test::${line}"
          done
          exit "${status}"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: |
            test.log
            test-retry.log
          retention-days: 7
          if-no-files-found: ignore

      # 打包冒烟：不推送，只确认 13 个库仍能产出包（防止 Assets/Pack 元数据回归）。
      - name: Pack (smoke)
        run: dotnet pack Pi.slnx -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true

      - name: Verify 13 packages
        run: |
          set -euo pipefail
          count="$(find artifacts -name '*.nupkg' | wc -l)"
          if [[ "${count}" -ne 13 ]]; then
            echo "::error::期望 13 个 nupkg，实际 ${count} 个"
            ls -1 artifacts
            exit 1
          fi
          for pkg in Pi.Cli Pi.Vacation Pi.DurableHost Pi.Evals; do
            if compgen -G "artifacts/${pkg}.*.nupkg" > /dev/null; then
              echo "::error::可执行项目 ${pkg} 不应产出 NuGet 包"
              exit 1
            fi
          done
          echo "OK: 13 个库包，未包含可执行项目" >> "${GITHUB_STEP_SUMMARY}"
